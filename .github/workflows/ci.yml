name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret
      ALLOWED_ORIGIN: http://127.0.0.1:8000
      ALLOWED_CORS_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
      CONTENT_SECURITY_POLICY: "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
      HTTPS_OR_TLS: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install --upgrade pip
      - name: Syntax check
        run: python -m py_compile server.py
      - name: Unit smoke test
        run: python smoke_tests.py
      - name: Route auth regression
        run: python test_auth_routes.py
      - name: Dependency scan
        run: python -m pip check
      - name: Secret scan
        run: grep -R "companyhub-local-dev-secret-change-me\|password_hash\|JWT_SECRET" -n server.py || true
